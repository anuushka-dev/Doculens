[project]
name = "doculens"
version = "0.1.0"
description = "Evidence-first document intelligence for technical PDFs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.9,<2",
    "fastapi>=0.143.2",
    "numpy>=1.26,<3",
    "pydantic-settings>=2.16.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "sentence-transformers>=3.4,<6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.uv.build-backend]
module-name = "app"
module-root = ""
